[package]
name = "meow-mobile"
description = "meow-rs as a library for phone apps: Android JNI (VpnService) entry points"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meow-app = { path = "../meow-app", features = ["embed"] }
meow-common = { workspace = true }
# The site of a host (Public Suffix List), exported to the app below.
meow-proxy = { workspace = true, default-features = false }
# Config generation for the app (dart:ffi `paopao_build` / `paopao_parse` /
# `paopao_free`), exported from this same library: the app already loads it.
meow-paopao = { path = "../meow-paopao", features = ["ffi"] }
anyhow = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[lints]
workspace = true
