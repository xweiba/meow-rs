<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaoPao 旁路由</title>
<style>
  :root { color-scheme: light dark; --a: #2f6fed; --m: #888; --b: rgba(127,127,127,.25); }
  body { font: 15px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 16px; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .card { border: 1px solid var(--b); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .row span:first-child { color: var(--m); }
  .tip { background: rgba(47,111,237,.1); border-radius: 8px; padding: 10px; }
  .big { font-size: 18px; font-weight: 600; }
  .muted { color: var(--m); font-size: 13px; }
  .err { color: #d33; font-size: 13px; }
  button { font: inherit; border: 1px solid var(--b); background: transparent; color: inherit; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.on, button.primary { background: var(--a); border-color: var(--a); color: #fff; }
  input { font: inherit; padding: 6px 8px; border: 1px solid var(--b); border-radius: 8px; background: transparent; color: inherit; flex: 1; min-width: 0; }
  .line { display: flex; gap: 8px; margin-top: 8px; }
  .modes { display: flex; gap: 8px; }
  .modes button { flex: 1; }
  .sub { border-top: 1px solid var(--b); padding: 8px 0; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .sub:first-child { border-top: 0; }
  details summary { cursor: pointer; color: var(--m); }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 14px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<h1>PaoPao 旁路由</h1>

<div class="card">
  <div class="tip">把手机、电脑的 <b>网关</b> 和 <b>DNS</b> 都设为 <b class="big" id="ip">…</b> 就能用。<br>
  <span class="muted">只改 DNS、不改网关的设备也能正常上网，只是不走代理。</span></div>
</div>

<div class="card">
  <h2>状态</h2>
  <div class="row"><span>当前线路</span><span id="line">…</span></div>
  <div class="row"><span>速度</span><span id="speed">…</span></div>
  <div class="row"><span>正在使用的设备</span><span id="clients">…</span></div>
  <div class="row"><span>分流规则</span><span id="rules">…</span></div>
  <div class="row"><span>地址</span><span id="addr">…</span></div>
</div>

<div class="card">
  <h2>模式</h2>
  <div class="modes">
    <button data-mode="smart">智能</button>
    <button data-mode="global">全局</button>
    <button data-mode="direct">直连</button>
  </div>
  <div class="muted" id="modeTip"></div>
</div>

<div class="card">
  <h2>订阅</h2>
  <div id="subs"><div class="muted">还没有订阅，粘贴机场给的订阅链接即可。</div></div>
  <div class="line"><input id="url" placeholder="粘贴订阅链接"><button class="primary" id="add">添加</button></div>
  <div class="line"><button id="refresh">立即更新</button><span class="muted" style="align-self:center">每 12 小时自动更新</span></div>
</div>

<div class="card">
  <h2>修改密码</h2>
  <div class="line"><input id="pw" type="password" placeholder="新密码（至少 6 位）"><button id="setpw">保存</button></div>
</div>

<div class="card">
  <details>
    <summary>高级</summary>
    <div style="margin-top:8px">
      <div class="row"><span>DNS 查询</span><span id="dnsq">…</span></div>
      <div class="row"><span>缓存命中</span><span id="dnsc">…</span></div>
      <div class="row"><span>走代理规则 / 经线路解析 / 国内解析 / 失败</span><span id="dnsr">…</span></div>
      <div class="row"><span>网卡</span><span id="nic">…</span></div>
      <div class="muted" style="margin-top:8px">国内 DNS 上游（只设 DNS 的设备解析国内网站用它们，逗号分隔）</div>
      <div class="line"><input id="ups"><button id="setups">保存</button></div>
    </div>
  </details>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const tips = { smart: '国内网站直连，国外走代理（推荐）', global: '所有网站都走代理', direct: '都不走代理' };
let upsDirty = false;

function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2500); }
function rate(b) { if (b < 1024) return b + ' B/s'; if (b < 1048576) return (b / 1024).toFixed(1) + ' KB/s'; return (b / 1048576).toFixed(1) + ' MB/s'; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';'); }
function ago(ms) { if (!ms) return '未更新'; const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? '刚刚更新' : m < 60 ? m + ' 分钟前更新' : Math.round(m / 60) + ' 小时前更新'; }

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('出错了（' + r.status + '）'));
  return j;
}

async function load() {
  let s;
  try { s = await api('GET', '/api/status'); } catch (e) { return; }
  $('ip').textContent = s.ip || '正在获取地址…';
  $('line').textContent = s.core ? (s.lines ? (s.line || '…') : '还没有节点，先添加订阅') : '内核未运行';
  $('speed').textContent = '↑ ' + rate(s.up) + '　↓ ' + rate(s.down);
  $('clients').textContent = s.clients + ' 台';
  $('rules').textContent = s.ruleData && s.ruleData.ready ? '已就绪' : '正在下载…';
  $('addr').textContent = s.ip ? (s.ip + '/' + s.prefix + (s.addrSource === 'dhcp' ? '（自动获取）' : '（固定）')) : '…';
  $('nic').textContent = s.iface + (s.wifi ? '（Wi-Fi）' : '') + ' ' + s.mac;
  document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === s.mode));
  $('modeTip').textContent = tips[s.mode] || '';
  const d = s.dns;
  $('dnsq').textContent = d.queries;
  $('dnsc').textContent = d.cacheHits;
  $('dnsr').textContent = d.viaCore + ' / ' + d.viaLine + ' / ' + (d.viaUpstream + d.hosts) + ' / ' + d.failed;
  if (!upsDirty) $('ups').value = d.upstreams.map((u) => u.replace(/:53$/, '')).join(', ');
  const subs = s.subscriptions;
  $('subs').innerHTML = subs.length ? subs.map((x) =>
    '<div class="sub"><div><div>' + esc(x.name || x.host) + '</div><div class="muted">' + x.nodes + ' 个节点 · ' + ago(x.updated) + '</div>' +
    (x.error ? '<div class="err">' + esc(x.error) + '</div>' : '') +
    '</div><button data-del="' + esc(x.id) + '">删除</button></div>').join('')
    : '<div class="muted">还没有订阅，粘贴机场给的订阅链接即可。</div>';
}

document.querySelectorAll('[data-mode]').forEach((b) => b.onclick = async () => {
  try { await api('POST', '/api/mode', { mode: b.dataset.mode }); toast('已切换'); load(); } catch (e) { toast(e.message); }
});
$('add').onclick = async () => {
  const url = $('url').value.trim();
  if (!url) return toast('先粘贴订阅链接');
  $('add').disabled = true; toast('正在下载订阅…');
  try { await api('POST', '/api/subscriptions', { url }); $('url').value = ''; toast('已添加'); load(); }
  catch (e) { toast(e.message); }
  $('add').disabled = false;
};
$('subs').onclick = async (ev) => {
  const id = ev.target.dataset && ev.target.dataset.del;
  if (!id || !confirm('删除这个订阅？')) return;
  try { await api('DELETE', '/api/subscriptions/' + encodeURIComponent(id)); toast('已删除'); load(); } catch (e) { toast(e.message); }
};
$('refresh').onclick = async () => {
  try { await api('POST', '/api/refresh'); toast('正在更新，稍等片刻'); } catch (e) { toast(e.message); }
};
$('setpw').onclick = async () => {
  const password = $('pw').value;
  try { await api('POST', '/api/password', { password }); $('pw').value = ''; toast('密码已修改，请用新密码重新登录'); setTimeout(() => location.reload(), 1500); }
  catch (e) { toast(e.message); }
};
$('ups').oninput = () => upsDirty = true;
$('setups').onclick = async () => {
  const upstreams = $('ups').value.split(/[,，\s]+/).filter(Boolean);
  try { await api('POST', '/api/dns', { upstreams }); upsDirty = false; toast('已保存'); load(); } catch (e) { toast(e.message); }
};

load();
setInterval(load, 2000);
</script>
</body>
</html>
